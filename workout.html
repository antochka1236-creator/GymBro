<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymBro - Workout Generator</title>
    <!-- Icon  -->
    <link rel="icon" type="icon.svg" href="assets/logo/logo.svg">
    <meta name="description" content="Workout program generator for beginners with weight tracking.">
    <!-- Estilos -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Miranda+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
</head>
<body>
   <section id="workout-page">
    <div class="workout-flex">
        <div class="logo">
            <img src="assets/logo/logo_white.svg" alt="Logo White">
            <img src="assets/logo/logo.svg" alt="Logo Blue">
            <div id="logo-workout">GymBro</div>
        </div>
        <div class="user-presence">
            <p id="current-user"></p>
            <button id="change-user">⇄</button>
        </div>
    </div>
    <div class="modal" id="modal">
        <div class="modal-content">
            <h3 id="modal-title"></h3>
            <p id="modal-description"></p>
            <canvas id="weightChart"></canvas>
        </div>
        <div id="modal-boton">X</div>
    </div>
   </section>
   
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/script.js"></script>
    
</body>
</html>
