<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymBro - Workout Generator</title>
    <!-- Icon  -->
    <link rel="icon" type="icon.svg" href="assets/logo/logo.svg">
    <meta name="description" content="Workout program generator for beginners with weight tracking.">
    <!-- Estilos -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
   <section id="workout-page">
